#
# Usage:
#   ./configure                             # read this file + make (default)
#   ./configure --with-modules=a,b,c       # whitelist (only build these + REQUIRED forced)
#   ./configure --without-modules=x,y,z    # blacklist (don't build these; REQUIRED ignored)
#   ./configure --modules-conf=<path>      # specify a different modules.conf
#
# REQUIRED modules (signaling / oam / dbal / endpoints / agent_pool / queue)
# disabling is forbidden -> configure exits with error directly; runtime YAML modules.disable also fails fast.
#
# Two keywords: enable / disable
#   enable  xxx   <- explicitly enable (whitelist mode: only those listed in enable + REQUIRED get built)
#   disable xxx   <- explicitly disable (blacklist mode: all enabled except those in disable)
# Anything not mentioned falls through to default rules. When both enable and disable appear, enable takes priority (whitelist).

[autoload]

# ---- Core modules (REQUIRED: disabling forbidden) ----
# signaling          ; MOD_F_REQUIRED | MOD_F_CALL_PATH —— SIP B2BUA core
# dbal               ; MOD_F_REQUIRED —— database abstraction layer
# oam                ; MOD_F_REQUIRED —— ops/control/config
# endpoints          ; MOD_F_REQUIRED —— extension HA1 lookup (required for SIP REGISTER)
# agent_pool         ; MOD_F_REQUIRED —— ACD agent pool
# queue              ; MOD_F_REQUIRED —— ACD queue

# ---- Non-core modules (optional) ----
# enable  billing       ; cdr_sink / rating —— without billing, CDRs fall back to degraded spool
# enable  dialplans     ; dialplan layer matching
# enable  outreg        ; outbound registration (can disable if no outbound calls needed)
# enable  recording     ; §17 recording
# enable  hep           ; HEPv3 probe
# enable  ha            ; high-availability heartbeat
# enable  presence       ; presence
# enable  cachedb       ; cache abstraction
# enable  asr_tts       ; ASR/TTS interface
# enable  formats       ; media format negotiation
# enable  codecs        ; codec registration
# enable  applications  ; IVR / application framework
# enable  event_handlers; event hooks
# enable  ai_dialog      ; REQ-AI-001 AI dialog module (media capture + ASR/TTS + SIP replay) —— optional load
# enable  playback       ; FreeSWITCH-style WAV playback (playback / playback_loop / playback_chain)
# security               ; static blacklist + dynamic auto-ban (hard dependency in b2bua.c -> forced STATIC, no config needed)

# ---- Example: minimal config (only core + essential modules) ----
# enable  billing
# enable  dialplans
# enable  recording

# ---- Example: remove what you don't need ----
disable hello           ; examples/ walkthrough (teaching only, verbose startup logs, not loaded by default)
# disable asr_tts
# disable presence
# disable cachedb
