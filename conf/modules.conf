# NSBC 编译时模块选择（类似 FreeSWITCH conf/autoload_configs/modules.conf.xml）
#
# 用法：
#   ./configure                             # 读本文件 + make（默认）
#   ./configure --with-modules=a,b,c       # 白名单（只编这些 + REQUIRED 强制）
#   ./configure --without-modules=x,y,z    # 黑名单（不编这些；REQUIRED 忽略）
#   ./configure --modules-conf=<path>      # 指定别的 modules.conf
#
# REQUIRED 模块（signaling / oam / dbal / endpoints / agent_pool / queue）
# 禁止 disable → configure 直接报错退出；运行时 YAML modules.disable 也会 fail-fast。
#
# enable / disable 两种关键字：
#   enable  xxx   ← 显式开启（白名单模式：只编 enable 里列的 + REQUIRED）
#   disable xxx   ← 显式关闭（黑名单模式：全 enable 除了 disable 里的）
# 没提的 = 走默认规则。enable 和 disable 同时出现时 enable 优先（白名单）。

[autoload]

# ---- 核心模块（REQUIRED：禁止 disable）----
# signaling          ; MOD_F_REQUIRED | MOD_F_CALL_PATH —— SIP B2BUA 核心
# dbal               ; MOD_F_REQUIRED —— 数据库抽象层
# oam                ; MOD_F_REQUIRED —— 运维/控制/配置
# endpoints          ; MOD_F_REQUIRED —— 分机 HA1 查询（SIP REGISTER 必需）
# agent_pool         ; MOD_F_REQUIRED —— ACD 座席池
# queue              ; MOD_F_REQUIRED —— ACD 队列

# ---- 非核心模块（可选）----
# enable  billing       ; cdr_sink / rating —— 没开 billing 会导致 CDR 走降级 spool
# enable  dialplans     ; 拨号计划层匹配
# enable  outreg        ; 外呼注册（无外呼需求可关）
# enable  recording     ; §17 录音
# enable  hep           ; HEPv3 探针
# enable  ha            ; 高可用心跳
# enable  presence       ; 在线状态
# enable  cachedb       ; cache 抽象
# enable  asr_tts       ; ASR/TTS 接口
# enable  formats       ; 媒体格式协商
# enable  codecs        ; 编解码器注册
# enable  applications  ; IVR / 应用框架
# enable  event_handlers; 事件钩子
# enable  ai_dialog      ; REQ-AI-001 AI 对话模块（媒体抓流 + ASR/TTS + SIP 回送）——可选加载
# enable  playback       ; FreeSWITCH 风格 WAV 播放（playback / playback_loop / playback_chain）
# security               ; 静态黑名单 + 动态 auto-ban（b2bua.c 硬依赖 → 强制 STATIC，无需配置）

# ---- 示例：最小化配置（只有核心 + 必要模块）----
# enable  billing
# enable  dialplans
# enable  recording

# ---- 示例：去掉不需要的 ----
disable hello           ; examples/ walkthrough（教学用，启动日志量大，默认不加载）
# disable asr_tts
# disable presence
# disable cachedb
