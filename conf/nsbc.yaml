# ============================================================
# NSBC unified config file (shared by nsbcd + nsbc-web)
# ============================================================
#
# [Deployment conventions]
#   This YAML file lives at <deploy-root>/conf/nsbc.yaml
#   All relative paths are resolved relative to THIS file's directory (conf/)
#   So "../tls/cert.pem" actually points to <deploy-root>/tls/cert.pem
#   The whole deploy directory can be moved anywhere — no YAML changes needed
#
# [Deployment directory layout]
#   /home/nway/nsbc/                    <- deploy root (example path, relocatable)
#   ├── nsbcd
#   ├── conf/nsbc.yaml                  <- ← this file lives here
#   ├── web/nsbc-web + static/
#   ├── tls/cert.pem + key.pem          <- auto_generate creates automatically
#   ├── logs/                           <- mkdir_p creates automatically
#   ├── run/                            <- UDS socket directory
#   └── data/snapshots/
#
# [Startup order]: start Web first (auto_generate creates certs), then nsbcd
#   cd /home/nway/nsbc/web && ./nsbc-web &
#   sleep 2
#   cd /home/nway/nsbc && ./nsbcd &
#
# [Config search order on both sides]
#   nsbcd (C)  : -c > <exe>/conf/nsbc.yaml -> /etc/nsbc/nsbc.yaml
#   nsbc-web  : -c > <exe>/../conf/nsbc.yaml -> <exe>/conf/nsbc.yaml -> ./conf/ -> /etc/nsbc/nsbc.yaml
#   -> both find this conf/nsbc.yaml
#
# [Keys ignored by nsbcd vs nsbc-web]
#   nsbcd reads: log.*, net.*, oam.*, sip.*, registrar.*, system.*
#               -> ignores web.*, auth.*, db.*, audit.*
#   nsbc-web reads: web.*, auth.*, db.*, core.*, audit.*
#               -> ignores net.*, oam.*, registrar.*, system.*
#
# ============================================================

config_version: "1.0"

# ---- Shared core section ----
core:
  # read by nsbcd (B2B memory limits, etc.)
  workers: 0            # 0 = match CPU core count
  max_calls: 2000      # conservative value of 10K, increase as needed
  timer_tick_ms: 100

  # UDS socket already hardcoded to /var/run/nsbc/ in C/Web code,
  # this config key is ignored (kept only for tools like nsbc_cli to read/parse)
  control_sock: "unix:/var/run/nsbc/control.sock"
  data_sock:    "/var/run/nsbc/data.sock"

# ---- nsbcd-only ----
log:
  level: info
  path:       "../logs/nsbcd.log"       # relative to conf/ -> ../logs/
  audit_path: "../logs/audit.jsonl"

net:
  sip_udp_port: 5060
  sip_tcp_port: 5060
  sip_tls_port: 5061
  # SIP TLS — shares ../tls/ cert files with web.tls
  # nsbc-web auto_generate creates certs on startup + background hourly auto-renewal
  # nsbcd only reads cert files, does not participate in renewal logic
  tls_enabled: true
  tls_cert: "../tls/cert.pem"           # relative to conf/ -> ../tls/
  tls_key:  "../tls/key.pem"
  tls_min_version: "1.2"

sip:
  bind: "0.0.0.0:5060"
  ws:
    enabled: true
    port: 5062       # change to whatever you want
    tls: true

oam:
  control_sock: "unix:/var/run/nsbc/control.sock"   # hardcoded, config ignored
  metrics_enabled: true
  metrics_bind: "127.0.0.1:9100"

registrar:
  # SIP REGISTER auth secret; empty = use digest_secret default
  # digest_secret: "file:../tls/key.pem"
  min_expires: 60
  default_expires: 3600
  max_expires: 3600

# ---- Call recording (REQ-REC-001~004, P1 implementation) ----
recording:
  enabled: true                         # set false to disable recording
  path: "./recordings"                 # relative to conf/ -> deploy root/recordings
  policy: "dialplan"                    # always / dialplan / manual / never
  mode: "mixed"                         # mixed / separate / single
  format: "wav"                         # wav / opus / g711
  max_concurrent: 128                   # max concurrent recording sessions

# ---- Fail2ban auto-ban (REQ-SEC-005, nsbcd-only) ----
# C side security module reads these YAML keys; hardcoded defaults below
# are used when keys are absent. Every auto-ban lands on CDR.is_malicious=1
# so the Web UI can Tab-separate "正常" vs "恶意" calls.
security:
  # master switch: false = 所有 fail2ban 计数不启用（静态 blacklist 仍生效）
  auto_ban: true                        # 默认 on（src/mod/security/security.c:1716）

  # SIP REGISTER auth-failure trigger（扫号器最常触发的通道）
  # 60 秒内同一 IP 认证失败 >= threshold → ban ban_duration_s 秒
  authfail_threshold: 3                 # 3 次就 ban（默认 5；攻击流量阈值建议 2-3）
  authfail_window_s: 30                 # 30 秒窗口（默认 60）
  ban_duration_s: 3600                  # ban 1 小时（默认 3600；重犯按 strikes 阶梯加重）

  # SIP REGISTER rate-limit（即使认证通过也拦突发 REGISTER flood）
  ratelimit_regs: 10                    # window 内最多 REGISTER 次数（默认 10）
  ratelimit_window_s: 30                # 窗口秒（默认 30）

  # INVITE flood guard（注册完成后同一 IP 狂发 INVITE）
  ratelimit_invites: 20                 # 全局滑窗内最多 new INVITE（默认 20）
  ratelimit_invites_active: 5           # 同时活跃 INVITE 数上限（默认 5）

system:
  config_snapshot_dir: "../data/snapshots"

# ---- nsbc-web-only ----
web:
  enabled: true
  bind: "0.0.0.0:443"
  tls:
    # ---- basics ----
    enabled: true                        # set false for plain HTTP

    # cert files (shared with nsbcd SIP TLS; change path and both sides change together)
    cert_path: "../tls/cert.pem"
    key_path:  "../tls/key.pem"

    # ---- cert source (choose one, auto-prioritized) ----
    # 1) both cert_path + key_path exist -> use directly (no renewal, user-managed)
    # 2) public: true               -> public ACME Let's Encrypt (requires certmagic dep; current fallback self-signed)
    # 3) auto_generate: true        -> intranet self-signed + background auto-renew (default)
    auto_generate: true

    # ---- intranet self-signed mode ----
    validity_days: 2                     # very short validity (security first), background auto-renew
    san: "10.0.0.80"                    # comma-separated; empty = auto-fill bind IP + localhost
                                         # public mode appends domain to SAN list
    # renewal loop parameters (check every check_interval_secs)
    check_interval_secs: 3600            # default check interval: 1h
    renew_threshold_hours: 24            # re-sign when remaining <= 24h (2-day validity -> renew at 1 day)

    # ---- public ACME mode (certmagic TLS-ALPN-01 — experimental ✅) ----
    # enablement steps:
    #   1) on a machine with network: cargo fetch --features acme && cargo vendor
    #   2) cargo build --features acme --release
    #   3) change the 4 values below; certmagic automatically requests from Let's Encrypt + background renewal
    # key: TLS-ALPN-01 only uses port 443/8443, **no extra port 80 needed**!
    # public environment requirements:
    #   - domain must have DNS A record pointing to this server's public IP
    #   - port 8443 must be externally reachable (certmagic handles ACME challenge inside TLS handshake)
    #   - staging=true for first rollout (avoid production 5/week/domain rate limit)
    public: false                        # <- change to true to enable public ACME
    domain: "nsbc.opensips.net.cn"           # <- real domain, Let's Encrypt uses this to sign
    acme_email: "1354608370@qq.com"        # <- expiry/revocation notifications (can be empty but strongly recommended)
    acme_cache_dir: "../acme-cache"      # <- account + cert cache (avoids re-request on restart)
    acme_staging: false                   # <- true for testing, false for production

  # ---- External API (REQ-EXT-API-004: loopback 免鉴权) ----
  # 默认：127.0.0.1 / ::1 本机请求自动跳过 API Key 检查（本机脚本零摩擦）。
  # 反代部署（nginx/Apache → 127.0.0.1:8443）必须设 true —— 反代过来的远程请求 peer 也是 loopback。
  ext:
    require_loopback_auth: false         # 默认 false（本机免鉴权）；反代必须 true

auth:
  # JWT signing secret (>=32 bytes; production MUST replace with a random value!)
  # openssl rand -hex 32 -> 64-char hex
  jwt_secret: "9b3dfd84a988ac85f1f21d42d50a046314932b49d738bb0e3fc3dd570d07f7bf99a8d042ddda65fb12285573ceed0832"

  # default account passwords (only effective when web_users table is empty; production must change DB explicitly)
  # priority: NSBC_DEFAULT_ADMIN_PW env > cfg here > hardcoded "Admin123"
  # after changing here, delete DB or set NSBC_RESET_ADMIN=1 and restart web to take effect
  # default_admin_pw: "Admin123"
  # default_dev_pw:   "Admin123"

db:
  # recommended SQLite (zero dependencies):
  dsn: "sqlite:///../db/web.db"
  # PostgreSQL:
  # dsn: "postgres://postgres:Nway2017@127.0.0.1:5432/nsbcdb"
  # environment variable NSBC_DB_DSN overrides this value

audit:
  file: "../logs/audit.jsonl"
