[package]
name = "nsbc-web"
version = "2.5.5"
edition = "2021"
description = "NSBC Web management sidecar (REQ-WEB-001~021, deployed separately from the core process)"
publish = false

[[bin]]
name = "nsbc-web"
path = "src/main.rs"

[dependencies]
# Tech stack baseline (REQ-WEB-002, frozen): Tokio + Axum; Actix-Web forbidden (unsafe)
# NOTE: do NOT add "blocking" feature — it existed only in tokio 0.x and was removed in tokio 1.0;
# spawn_blocking is always available with rt/rt-multi-thread
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "matched-path", "query", "tokio"] }
# SSE real-time push (nsbc-esl-web §8#1): BroadcastStream converts tokio broadcast channel
# into axum SSE event stream, so front-end /calls/stream can subscribe to SESSION events in real time
# (replaces 5-second polling). This crate already ships with axum in vendor/ and Cargo.lock
# (no new supply-chain surface for offline builds).
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "limit", "set-header"] }
hyper = { version = ">=1.1.0, <2", features = ["server", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Bridge between hyper 1.0 and tokio-rustls: TokioIo wraps TlsStream(AsyncRead+AsyncWrite)
# into a transport that hyper can consume
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "http1", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Config/CDR queries go through the core DBAL; sidecar's direct DB connection is read-only
# (REQ-WEB-013 restricted account)
# sqlx: Web sidecar persistence layer (REQ-WEB-013 restricted account, read-only + append-only
# writes for CDR/audit)
# "any" feature lets the DSN scheme select the backend at runtime; "derive" enables the FromRow macro
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql", "tls-rustls", "any", "derive"] }
# Front-end static assets are embedded at compile time (REQ-WEB-004: nsbc-web bootstraps its own
# SPA with zero Node runtime dependency)
# rust-embed only uses include_bytes! + PhantomData — no unsafe, compatible with deny(unsafe_code)
rust-embed = "8"
# Authentication foundation (REQ-WEB-008 P0): argon2id password verification (one of the key
# dependencies locked by SRS)
argon2 = { version = "0.5", default-features = false, features = ["std"] }
# JWT HS256 compact signing/verification: ring/getrandom/base64 are already in the lock with rustls,
# so referencing them adds no new supply-chain surface
ring = { version = "0.17", default-features = false, features = ["std"] }
getrandom = { version = "0.2" }
base64 = "0.22"
# SIP Digest HA1 computation (used for the default extensions seed) — zero dependencies, pure Rust
md-5 = "0.10"
# TLS self-signed certificate generation (used for Web-side auto-generate P0)
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# PEM file parsing (rustls needs Vec<CertificateDer> + PrivateKeyDer to build ServerConfig)
rustls-pemfile = "2"
# Certificate validity computation (time::OffsetDateTime::now_utc() + Duration::days)
time = { version = ">=0.3.34, <0.4", default-features = false, features = ["std"] }

# ---- Public ACME certificate auto-renewal (experimental, feature-gated) ----
# Enable: cargo build --features acme
# Disabled by default: does not affect offline builds (no new crate in vendor/)
# Before enabling, run on a machine with internet: temporarily comment out replace-with in
# .cargo/config.toml → cargo generate-lockfile → cargo vendor
certon = { version = "0.3", optional = true }

[features]
# Public HTTPS: certon automatically requests certificates from Let's Encrypt/ZeroSSL +
# background renewal
acme = ["certon"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
