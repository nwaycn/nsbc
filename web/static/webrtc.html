<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWSBC WebRTC Video Call</title>
<script src="js/jssip-3.10.0.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, 'PingFang SC', sans-serif;
         background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
         min-height: 100vh; color: #e2e8f0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px 0; }
  h1 .tag { font-size: 11px; background:#2563eb; padding:2px 8px; border-radius:10px; margin-left:8px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px; }
  .card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
          border-radius:12px; padding:16px; backdrop-filter: blur(10px); }
  .card h3 { margin:0 0 12px 0; font-size:14px; color:#94a3b8; font-weight:500; text-transform:uppercase; letter-spacing:1px; }
  .row { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .row label { width:90px; font-size:13px; color:#cbd5e1; flex-shrink:0; }
  .row input { flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.15);
               border-radius:8px; padding:8px 12px; color:#e2e8f0; font-size:14px; outline:none; }
  .row input:focus { border-color:#3b82f6; }
  .row input[disabled] { opacity:0.5; cursor:not-allowed; }
  .btn { padding:8px 18px; border-radius:8px; border:none; font-size:13px; font-weight:500;
         cursor:pointer; transition: all .15s; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-blue { background:#3b82f6; color:#fff; }  .btn-blue:hover:not(:disabled){ background:#2563eb; }
  .btn-green{ background:#10b981; color:#fff; }  .btn-green:hover:not(:disabled){ background:#059669; }
  .btn-red  { background:#ef4444; color:#fff; }  .btn-red:hover:not(:disabled){ background:#dc2626; }
  .btn-gray { background:#475569; color:#fff; }  .btn-gray:hover:not(:disabled){ background:#334155; }
  .status { font-size:13px; }
  .status.ok { color:#4ade80; } .status.err { color:#f87171; }
  .videos { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .video-box { position:relative; aspect-ratio: 4/3; background:#000; border-radius:10px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); }
  .video-box video { width:100%; height:100%; object-fit:cover; }
  .video-box .lbl { position:absolute; bottom:8px; left:8px; font-size:11px;
                    background:rgba(0,0,0,0.6); padding:2px 8px; border-radius:4px; color:#94a3b8; }
  .video-box .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
  .video-box .dot.on { background:#4ade80; box-shadow:0 0 6px #4ade80; }
  .video-box .dot.off { background:#64748b; }

  /* ---- 媒体能量指示：音频 RMS 电平 + 视频帧间动态 ---- */
  .meters { position:absolute; top:10px; right:10px; width:152px; display:flex;
            flex-direction:column; gap:8px; padding:9px 11px; border-radius:12px;
            background:linear-gradient(180deg, rgba(2,6,23,.86), rgba(15,23,42,.74));
            border:1px solid rgba(96,165,250,.4);
            box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
            backdrop-filter:blur(6px); pointer-events:none; }
  .mrow { display:flex; align-items:center; gap:8px; }
  .mkey { width:12px; font-size:10px; font-weight:700; letter-spacing:.5px;
          color:#93c5fd; text-shadow:0 0 6px rgba(96,165,250,.6);
          font-family:'JetBrains Mono',monospace; }
  .mbar { position:relative; flex:1; height:12px; border-radius:6px;
          background:#070d1a; border:1px solid rgba(255,255,255,0.18);
          box-shadow:inset 0 2px 4px rgba(0,0,0,.9), inset 0 -1px 0 rgba(255,255,255,.06);
          overflow:hidden; }
  .mbar i { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:5px;
            background:linear-gradient(90deg,#00e676,#ffd600 65%,#ff3d00);
            box-shadow:0 0 10px rgba(0,230,118,.7); will-change:width; }
  .mbar.video i { background:linear-gradient(90deg,#00b0ff,#7c4dff 65%,#ff4081);
                  box-shadow:0 0 10px rgba(0,176,255,.7); }
  /* LED 分段刻度（覆盖在填充之上） */
  .mbar::after { content:''; position:absolute; inset:0; border-radius:5px;
                 background-image:repeating-linear-gradient(90deg,
                   transparent 0 5px, rgba(0,0,0,.6) 5px 7px); }
  .mbar.hot { border-color:rgba(255,82,82,.55); }
  .mbar.hot i { animation:pulse .55s ease-in-out infinite alternate; }
  @keyframes pulse { from { filter:brightness(1); } to { filter:brightness(1.6); } }
  .mval { width:26px; text-align:right; font-size:12px; font-weight:700;
          color:#64748b; font-variant-numeric:tabular-nums;
          font-family:'JetBrains Mono',monospace; }
  .mval.warn { color:#fbbf24; }
  .mval.hot  { color:#ff5252; text-shadow:0 0 8px rgba(255,82,82,.8); }
  .incoming { background:rgba(234,179,8,0.1); border:1px solid #eab308; border-radius:10px;
              padding:12px 16px; display:none; align-items:center; justify-content:space-between; }
  .incoming.show { display:flex; }
  .incoming .from { font-weight:600; color:#fbbf24; }
  .dc-area { display:flex; gap:8px; margin-bottom:8px; }
  .dc-area input { flex:1; }
  .dc-log { height:160px; overflow-y:auto; background:rgba(0,0,0,0.3); border-radius:8px;
            padding:8px; font-family: 'JetBrains Mono', monospace; font-size:12px; }
  .dc-log .in  { color:#60a5fa; }
  .dc-log .out { color:#a78bfa; }
  .dc-log .sys { color:#64748b; }
  .sip-log { height:200px; overflow-y:auto; background:#0a0f1a; border-radius:8px; padding:10px;
             font-family: 'JetBrains Mono', monospace; font-size:12px; line-height:1.6; }
  .sip-log .ts { color:#475569; }
  .sip-log .ok { color:#4ade80; }
  .sip-log .err { color:#f87171; }
  .sip-log .info { color:#93c5fd; }
  .sip-log .warn { color:#fbbf24; }
  .sip-log .tx { color:#f472b6; }
  .sip-log .rx { color:#34d399; }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar button { padding:4px 12px; font-size:12px; }

  .ring { animation: ring 0.6s ease-in-out infinite; }
  @keyframes ring { 0%,100%{ transform:rotate(-3deg);} 50%{ transform:rotate(3deg);} }

  /* ---- 拨号盘 ---- */
  .dialpad { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:8px; }
  .dialpad button { padding:14px 0; font-size:18px; font-weight:600;
                    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
                    border-radius:10px; color:#e2e8f0; cursor:pointer; transition: all .1s; }
  .dialpad button:hover { background:rgba(59,130,246,0.3); border-color:#3b82f6; }
  .dialpad button:active { transform:scale(0.95); background:rgba(59,130,246,0.5); }
  .dialpad button.wide { grid-column: span 2; font-size:14px; background:rgba(239,68,68,0.15); border-color:#ef4444; }
  .dialpad button.wide:hover { background:rgba(239,68,68,0.3); }

  /* ---- DTMF 显示 ---- */
  #dtmfDisplay { min-height:24px; padding:4px 8px; margin-top:4px;
                  background:rgba(0,0,0,0.3); border-radius:6px; font-size:14px;
                  font-family:'JetBrains Mono', monospace; color:#fbbf24;
                  transition: all .1s; }
  #dtmfDisplay.flash { background:rgba(251,191,36,0.3); transform:scale(1.02); }

  /* ---- Hold 按钮激活态 ---- */
  .btn-held { background:#f59e0b !important; color:#000 !important; }

  /* ---- 移动端自适应 ---- */
  @media (max-width: 768px) {
    .wrap { padding: 10px; }
    h1 { font-size: 18px; }
    .grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
    .row { flex-wrap: wrap; }
    .row label { width: 80px; font-size: 12px; }
    .row input { font-size: 16px; }     /* 防止 iOS 自动缩放 */
    .videos { grid-template-columns: 1fr; gap: 10px; }
    .video-box { aspect-ratio: 16/10; }  /* 手机上 16:10 更自然 */
    .video-box video { object-fit: contain; background:#000; }
    .card { padding: 12px; }
    .dialpad button { padding: 12px 0; font-size: 16px; }
    .btn { padding: 8px 14px; font-size: 13px; }
    /* 拨号盘 Del/Clear 保持 2 列 span */
    .dialpad button.wide { grid-column: span 2; }
    .incoming { flex-direction: column; gap: 10px; text-align: center; }
    .dc-area { flex-direction: column; }
    .sip-log, .dc-log { font-size: 11px; }
    .meters { width: 118px; padding: 6px 8px; gap: 6px; }
    .mbar { height: 10px; }
    /* 视频卡位置：远程在上、本地在下（镜像布局） */
    .card:nth-of-type(2) .videos > .video-box:first-child { order: 2; }
    .card:nth-of-type(2) .videos > .video-box:last-child  { order: 1; }
  }
  @media (max-width: 480px) {
    .video-box { aspect-ratio: 16/9; }
    .wrap { padding: 8px; }
    .card { padding: 10px; border-radius: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>NWSBC WebRTC Video Call <span class="tag">Standalone page - JsSIP + WSS</span></h1>

  <div class="grid">

    <div class="card">
      <h3>SIP Account</h3>
      <div class="row"><label>WSS Server</label><input id="wss" value="" placeholder="Auto derive from URL"></div>
      <div class="row"><label>STUN Server</label><input id="stun" value="" placeholder="Auto derive from URL"></div>
      <div class="row"><label>Extension</label><input id="user" value="1000"></div>
      <div class="row"><label>Password</label><input id="pass" type="password" value=""></div>
      <div class="row"><label>Realm / Tenant</label><input id="realm" value="nsbc.local" placeholder="SIP domain, e.g. nsbc.local / acme.com"></div>
      <div class="row">
        <button class="btn btn-green" id="btnReg" onclick="doRegister()">▶ Register</button>
        <button class="btn btn-red"   id="btnUnreg" onclick="doUnregister()" disabled>Unregister</button>
        <span class="status" id="regStatus">Not registered</span>
      </div>
    </div>

    <div class="card">
      <h3>Video</h3>
      <div class="videos">
        <div class="video-box">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="lbl"><span class="dot off" id="localDot"></span>Local</div>
          <div class="meters">
            <div class="mrow"><span class="mkey">A</span><div class="mbar"><i id="localAudioBar"></i></div><span class="mval" id="localAudioVal">0</span></div>
            <div class="mrow"><span class="mkey">V</span><div class="mbar video"><i id="localMotionBar"></i></div><span class="mval" id="localMotionVal">0</span></div>
          </div>
        </div>
        <div class="video-box">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="lbl"><span class="dot off" id="remoteDot"></span>Remote</div>
          <div class="meters">
            <div class="mrow"><span class="mkey">A</span><div class="mbar"><i id="remoteAudioBar"></i></div><span class="mval" id="remoteAudioVal">0</span></div>
            <div class="mrow"><span class="mkey">V</span><div class="mbar video"><i id="remoteMotionBar"></i></div><span class="mval" id="remoteMotionVal">0</span></div>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn btn-gray" onclick="muteAudio()" id="btnMute">🔊 Mute</button>
        <button class="btn btn-gray" onclick="stopVideo()" id="btnStopVid">📷 Stop Video</button>
        <button class="btn btn-gray" onclick="doHold()" id="btnHold">⏸ Hold</button>
      </div>
    </div>
  </div>

  <div class="incoming" id="incoming">
    <div>📞 Incoming: <span class="from" id="inFrom">—</span> <span class="ring">🔔</span></div>
    <div>
      <button class="btn btn-green" onclick="doAccept()" style="margin-right:6px">Accept</button>
      <button class="btn btn-red"   onclick="doReject()">Reject</button>
    </div>
  </div>

  <div class="grid" style="margin-top:16px">

    <div class="card">
      <h3>Dial / Call</h3>
      <div class="row">
        <label>Callee</label>
        <input id="target" value="1001">
        <button class="btn btn-green" id="btnCall" onclick="doCall()" disabled>📞 Call</button>
        <button class="btn btn-red"   id="btnHang" onclick="doHangup()" disabled>✕ Hangup</button>
      </div>
      <div class="row" style="margin-bottom:4px">
        <span class="status" id="callStatus">Idle</span>
      </div>
      <div class="row" style="flex-wrap:wrap;font-size:12px;color:#94a3b8;margin-bottom:8px">
        <span style="margin-right:14px">📞 呼叫: <span id="tmCallStart" style="color:#cbd5e1">—</span></span>
        <span style="margin-right:14px">⏱ 接续: <span id="tmPostDial" style="color:#cbd5e1">—</span></span>
        <span>🟢 通话中: <span id="tmCallDur" style="color:#4ade80;font-variant-numeric:tabular-nums">—</span></span>
      </div>
      <div id="dtmfDisplay"></div>
      <div class="dialpad">
        <button onclick="doDialKey('1')">1</button>
        <button onclick="doDialKey('2')">2</button>
        <button onclick="doDialKey('3')">3</button>
        <button onclick="doDialKey('4')">4</button>
        <button onclick="doDialKey('5')">5</button>
        <button onclick="doDialKey('6')">6</button>
        <button onclick="doDialKey('7')">7</button>
        <button onclick="doDialKey('8')">8</button>
        <button onclick="doDialKey('9')">9</button>
        <button onclick="doDialKey('*')">*</button>
        <button onclick="doDialKey('0')">0</button>
        <button onclick="doDialKey('#')">#</button>
        <button class="btn btn-gray" style="font-size:13px;padding:6px" onclick="doDialKey('⌫')">⌫ Del</button>
        <button class="btn btn-gray wide" onclick="doDialKey('C')">C Clear</button>
      </div>
    </div>

    <div class="card">
      <h3>DataChannel</h3>
      <div class="dc-area">
        <input id="dcMsg" placeholder="Type message, Enter to send..." disabled onkeydown="if(event.key==='Enter') dcSend()">
        <button class="btn btn-blue" onclick="dcSend()" id="btnDc" disabled>Send</button>
      </div>
      <div class="dc-log" id="dcLog"><div class="sys">Waiting for DataChannel open...</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>SIP Live Log</h3>
    <div class="sip-log" id="sipLog"></div>
  </div>

</div>
<script src="js/nsbc-phone.js?v=20261112a"></script>
<script>
// =============================================================================
// 媒体能量指示（仅本页增强，不改 nsbc-phone.js）
//   A 条：音频 RMS 电平（Web Audio AnalyserNode，快升慢降）
//   V 条：视频帧间灰度差（32x24 采样 canvas，反映画面切换/运动）
// srcObject 由 nsbc-phone.js 赋值，元素上无法监听其变化 → 500ms 轮询比对。
// =============================================================================
(function () {
  'use strict';
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null;

  function ensureAC() {
    if (!AC) return null;
    if (!ac) { try { ac = new AC(); } catch (_) { return null; } }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (_) {} }
    return ac;
  }
  // 自动播放策略：首次用户手势后解锁 AudioContext
  document.addEventListener('click', () => {
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (_) {} }
  });

  function makeMeter(ids) {
    const video = document.getElementById(ids.video);
    const bars = {
      a: document.getElementById(ids.audioBar),
      av: document.getElementById(ids.audioVal),
      v: document.getElementById(ids.motionBar),
      vv: document.getElementById(ids.motionVal),
    };
    if (!video || !bars.a || !bars.v) return null;

    const cv = document.createElement('canvas');
    cv.width = 32; cv.height = 24;
    const cx = cv.getContext('2d', { willReadFrequently: true });

    const st = {
      video, bars,
      stream: null, srcNode: null, analyser: null, buf: null,
      prev: null, lastSample: 0, aLvl: 0, vLvl: 0, _a: -1, _v: -1,
    };

    // 重新绑定音频分析链（换流或挂断时调用，传 null 即解绑）
    st.bind = (stream) => {
      if (st.stream === stream) return;
      st.stream = stream;
      if (st.srcNode) { try { st.srcNode.disconnect(); } catch (_) {} }
      st.srcNode = null; st.analyser = null; st.prev = null;
      st.aLvl = 0; st.vLvl = 0;
      if (!stream || !stream.getAudioTracks().length) return;
      const a = ensureAC();
      if (!a) return;
      try {
        st.srcNode = a.createMediaStreamSource(stream);
        st.analyser = a.createAnalyser();
        st.analyser.fftSize = 512;
        st.analyser.smoothingTimeConstant = 0.3;
        st.buf = new Uint8Array(st.analyser.fftSize);
        st.srcNode.connect(st.analyser);
      } catch (e) {
        console.warn('[meters] audio attach failed:', e.message);
      }
    };

    st.tick = (now) => {
      /* ---- 音频：RMS → 0..100 ---- */
      let aPct = 0;
      if (st.analyser && st.buf) {
        st.analyser.getByteTimeDomainData(st.buf);
        let sum = 0;
        for (let i = 0; i < st.buf.length; i++) {
          const d = (st.buf[i] - 128) / 128;
          sum += d * d;
        }
        aPct = Math.min(100, Math.sqrt(sum / st.buf.length) * 420);
      }
      st.aLvl = aPct > st.aLvl ? aPct : st.aLvl * 0.72;   // 快升慢降
      /* ---- 视频：每 100ms 采样一帧，比较相邻帧灰度平均绝对差 ---- */
      let vPct = 0;
      if (st.video.readyState >= 2 && now - st.lastSample >= 100) {
        st.lastSample = now;
        try {
          cx.drawImage(st.video, 0, 0, cv.width, cv.height);
          const px = cx.getImageData(0, 0, cv.width, cv.height).data;
          const n = px.length / 4;
          const gray = new Float32Array(n);
          let diff = 0;
          for (let i = 0, j = 0; i < px.length; i += 4, j++) {
            const g = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000;
            gray[j] = g;
            if (st.prev) diff += Math.abs(g - st.prev[j]);
          }
          if (st.prev) vPct = Math.min(100, (diff / n) * 8);
          st.prev = gray;
        } catch (_) {
          st.prev = null;   // 画面不可读（未就绪）时丢弃本帧
        }
      }
      st.vLvl = vPct > st.vLvl ? vPct : st.vLvl * 0.8;

      // 只在整数档位变化时写 DOM，避免 60fps 布局抖动
      const lvlCls = (lv, warn, hot) => lv >= hot ? 'hot' : (lv >= warn ? 'warn' : '');
      const a = Math.round(st.aLvl), v = Math.round(st.vLvl);
      if (a !== st._a) {
        st._a = a;
        st.bars.a.style.width = a + '%';
        st.bars.av.textContent = a;
        st.bars.av.className = 'mval ' + lvlCls(a, 55, 80);
        st.bars.a.parentNode.classList.toggle('hot', a >= 85);
      }
      if (v !== st._v) {
        st._v = v;
        st.bars.v.style.width = v + '%';
        st.bars.vv.textContent = v;
        st.bars.vv.className = 'mval ' + lvlCls(v, 50, 72);
        st.bars.v.parentNode.classList.toggle('hot', v >= 72);
      }
    };
    return st;
  }

  const meters = [
    makeMeter({ video: 'localVideo', audioBar: 'localAudioBar', audioVal: 'localAudioVal',
                motionBar: 'localMotionBar', motionVal: 'localMotionVal' }),
    makeMeter({ video: 'remoteVideo', audioBar: 'remoteAudioBar', audioVal: 'remoteAudioVal',
                motionBar: 'remoteMotionBar', motionVal: 'remoteMotionVal' }),
  ].filter(Boolean);
  if (!meters.length) return;

  // srcObject 变化检测
  setInterval(() => {
    for (const m of meters) m.bind(m.video.srcObject || null);
  }, 500);

  (function loop(now) {
    for (const m of meters) m.tick(now);
    requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
</body>
</html>
