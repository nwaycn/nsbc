; NSBC website runtime config (INI format)
; Lines starting with ; or # are ignored. Missing sections fall back to defaults.

[general]
; HTTP listen address. When acme.enable=true, certmagic takes over :443 and :80,
; so this addr is only used for plain-HTTP dev / LAN preview (set e.g. 127.0.0.1:8080).
addr = 0.0.0.0:443

[paths]
content    = content           ; Markdown docs/blog
db         = data/site.db      ; SQLite index
templates  = templates
assets     = assets

[acme]
; enable = true → auto-issue Let's Encrypt cert for [domain], background renew
;               (port 80 and 443 must be externally reachable; HTTP-01 challenge)
enable  = true
domain  = nsbc.nway.com.cn
email   = 1354608370@qq.com
cache_dir = /var/lib/nsbc/website/acme-cache   ; leave empty → ~/.local/share/certmagic
staging = false                ; true = Let's Encrypt staging CA (for testing only)
